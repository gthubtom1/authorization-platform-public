{% extends 'base.html' %}{% block title %}登录 · 直链管理{% endblock %}{% block content %}<section class="login-panel"><div class="section-heading"><h1>登录直链管理</h1><p>上传文件，维护你的固定下载链接。</p></div><form method="post" class="stack">{% csrf_token %}{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<label>账号<input name="username" autocomplete="username" required maxlength="150" autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary full" type="submit">登录</button></form><p class="subtle login-foot">仅管理员需要登录，客户通过直链下载。</p></section>{% endblock %}
