{% load static %}<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}直链管理{% endblock %}</title><link rel="stylesheet" href="{% static 'site.css' %}?v=20261117-table-1"><script src="{% static 'site.js' %}?v=20261117-table-1" defer></script></head>
<body class="{% block body_class %}{% endblock %}" data-owner="{{ request.user.pk|default:'' }}"><header class="topbar"><a class="brand" href="{% url 'index' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 15 6-6M8 17l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2-1 1-1a4 4 0 1 1 6 6l-4 4a4 4 0 0 1-6 0"/></svg>直链管理</a>{% if request.user.is_authenticated %}<nav aria-label="站点导航"><a href="{% url 'index' %}" {% if request.path == '/manage/' %}aria-current="page"{% endif %}>软件文件</a><a href="{% url 'settings' %}" {% if request.path == '/manage/settings/' %}aria-current="page"{% endif %}>设置</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="quiet" type="submit">退出</button></form></nav>{% endif %}</header>
<main>{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
