name: software-showcase
services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      SITE_DEBUG: "0"
      SITE_DATA_DIR: /data
      SITE_TRUST_PROXY: "1"
    restart: unless-stopped
    volumes:
      - site_data:/data
      - site_static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':os.environ['SITE_HOSTS'].split(',')[0],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - ./deploy/internal-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - site_static:/srv/static:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  site_data:
  site_static:
