<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#101c39">
<title>全部软件 · 软件集</title><link rel="icon" href="../static/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="catalog.css"><script src="catalog.js" defer></script>
</head>
<body id="top">
<a class="skip-link" href="#main">跳到软件列表</a>
<header class="masthead">
 <div class="topbar page-width">
  <a class="brand" href="./" aria-label="软件集首页"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 4h10v10H4zM19 4h9v10h-9zM4 19h10v9H4z" stroke="currentColor" stroke-width="1.7"/><path d="M19 19h9v9h-9z" fill="currentColor"/></svg><span data-site-name>软件集</span></a>
  <form class="search" role="search" id="searchForm"><label for="searchInput" class="sr-only">搜索软件名称或介绍</label><input id="searchInput" type="search" name="q" placeholder="搜索软件名称或介绍" maxlength="200" autocomplete="off"><button type="submit" aria-label="搜索软件"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button></form>
 </div>
 <div class="heading page-width"><h1 id="pageTitle">全部软件</h1><p class="result-count" id="resultCount" role="status">正在载入软件…</p></div>
 <div class="category-band"><nav class="categories page-width" id="categories" aria-label="软件分类"></nav></div>
</header>
<main id="main" class="page-width" tabindex="-1">
 <div id="searchContext" class="search-context" hidden><p id="searchSummary"></p><a id="clearSearch" href="./">清空搜索</a></div>
 <section id="softwareList" class="software-list" aria-label="软件列表" aria-busy="true"><div class="loading-state"><span class="loading-dot" aria-hidden="true"></span>正在载入软件…</div></section>
 <div class="page-bottom" id="pageBottom" hidden><p id="pageSummary"></p><nav class="pagination" aria-label="软件列表分页" id="pagination"></nav></div>
 <footer class="footer"><p id="siteFooter" hidden></p><a href="#top" id="backTop">返回顶部<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6M12 8v13"/></svg></a></footer>
</main>
<dialog class="lightbox" id="lightbox" aria-labelledby="lightboxTitle">
 <div class="lightbox-bar"><h2 id="lightboxTitle">软件截图</h2><div class="lightbox-tools"><span id="lightboxCount" aria-live="polite"></span><button type="button" class="icon-button" id="closeLightbox" aria-label="关闭大图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div></div>
 <div class="lightbox-stage"><img id="lightboxImage" alt=""><button type="button" class="image-arrow previous" id="lightboxPrev" aria-label="上一张图片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button type="button" class="image-arrow next" id="lightboxNext" aria-label="下一张图片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
