{% extends 'admin_base.html' %}{% block content %}<div class="page-heading"><h1>删除分类</h1></div><form method="post" class="compact-form">{% csrf_token %}<input type="hidden" name="revision" value="{{ item.revision }}"><h2>{{ item.name }}</h2>{% if error %}<p class="form-errors" role="alert">{{ error }}</p>{% endif %}{% if count %}<p>该分类中有 {{ count }} 款软件。删除分类前，请选择它们的新归属。</p><div class="field"><label for="target">转移到</label><select id="target" name="target" required><option value="">选择分类</option>{% for target in targets %}<option value="{{ target.pk }}">{{ target.name }}{% if not target.visible %}（已隐藏）{% endif %}</option>{% endfor %}</select></div>{% if not targets %}<p class="notice">需要先创建另一个分类，才能转移软件。</p>{% endif %}{% else %}<p>确定删除这个空分类？</p>{% endif %}<div class="form-actions"><a class="button secondary" href="{% url 'categories' %}">取消</a><button class="button destructive" type="submit" {% if count and not targets %}disabled{% endif %}>确认删除</button></div></form>{% endblock %}
