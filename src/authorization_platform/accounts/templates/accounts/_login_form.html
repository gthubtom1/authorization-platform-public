<form method="post" novalidate>
  {% csrf_token %}
  {% if next_path %}<input type="hidden" name="next" value="{{ next_path }}">{% endif %}
  {{ form.non_field_errors }}
  {% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}</div>{% endfor %}
  <button class="primary-button" type="submit">登录</button>
</form>
