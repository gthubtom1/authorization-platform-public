# Retired-domain regression fixture only. Never install this file; install-site.sh uses deploy/nginx/authorization-platform.conf.example.

server {
    listen 80;
    server_name retired.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name retired.example.com;

    ssl_certificate     /etc/letsencrypt/live/retired.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retired.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AuthorizationPlatformTLS:10m;
    ssl_session_tickets off;
    client_max_body_size 120m;
    access_log /var/log/nginx/authorization-platform-retired.example.com.access.log;
    error_log  /var/log/nginx/authorization-platform-retired.example.com.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    root __UI_ROOT__;
    # 不要设 index。根路径必须 404，不能自动打开入口页。

    location = / {
        add_header Cache-Control "no-store, max-age=0" always;
        error_page 404 /404.html;
        return 404;
    }
    location = /404.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location = /manage.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location = /manage-login.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location = /downstream.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location = /downstream-login.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location = /downstream-register.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location = /entry.html {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
    location = /healthz/ {
        proxy_pass http://127.0.0.1:18002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 600s;
    }
    location / {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }
}
