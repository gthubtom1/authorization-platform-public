<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>软件目录 · 展示网站预览</title>
  <style>
    :root{--bg:#141516;--side:#101112;--panel:#1b1c1e;--raised:#242629;--line:#303235;--text:#efefed;--secondary:#b4b5b8;--muted:#95979c;--accent:#c9dbaf;--accent-ink:#26351c;--radius:12px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button,a,input{-webkit-tap-highlight-color:transparent}button{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{opacity:.35;cursor:default}svg{display:block;width:20px;height:20px;flex-shrink:0}button svg{pointer-events:none}a{color:inherit;text-decoration:none}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    .sidebar{position:fixed;inset:0 auto 0 0;width:216px;background:var(--side);border-right:1px solid #27292c;display:flex;flex-direction:column;z-index:30;padding:32px 16px 20px}.brand{display:flex;align-items:center;gap:12px;margin:0 12px 44px;font-size:19px;font-weight:650;letter-spacing:.5px}.brand-mark{width:32px;height:32px;border:1px solid #737d67;border-radius:8px;display:grid;place-items:center;color:var(--accent)}.brand-mark svg{width:22px;height:22px}.nav-label{margin:0 16px 12px;color:var(--muted);font-size:12px}.category-list{display:flex;flex-direction:column;gap:6px;overflow:auto}.category{border:0;background:transparent;display:flex;align-items:center;width:100%;gap:12px;padding:13px 16px;border-radius:8px;text-align:left;color:var(--secondary);transition:background .15s,color .15s}.category:hover{background:#1c1e20;color:var(--text)}.category.active{background:#272d23;color:#e0e9d6}.category svg{width:18px;height:18px}.category-name{flex:1}.category-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.category.active .category-count{color:#c1cdb6}.sidebar-bottom{margin-top:auto;padding:32px 16px 0;color:var(--muted);line-height:1.9;font-size:12px}.sidebar-bottom strong{display:block;color:var(--secondary);font-size:13px;font-weight:500;margin-bottom:4px}.sidebar-close{display:none}
    .shell{margin-left:216px}.topbar{height:76px;border-bottom:1px solid #282a2c;display:flex;justify-content:space-between;align-items:center;padding:0 40px;gap:20px}.breadcrumb{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px}.breadcrumb span:last-child{color:var(--secondary)}.breadcrumb-separator{color:#55585e}.preview-label{font-size:11px;padding:4px 8px;border:1px solid #393c40;border-radius:4px;color:var(--secondary);white-space:nowrap}.mobile-menu{display:none}.topbar-right{display:flex;align-items:center;gap:20px}.topbar-note{font-size:12px;color:var(--muted)}
    main{max-width:1280px;margin:0 auto;padding:36px 40px 24px}.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}.page-title{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}h1{font-size:28px;line-height:1.3;font-weight:600;letter-spacing:-.5px;margin:0}.result-count{color:var(--muted);font-size:13px}.search{display:flex;align-items:center;gap:12px;border:1px solid #3b3d41;border-radius:8px;padding:0 14px;background:#191b1d;height:44px;width:280px}.search svg{width:17px;height:17px;color:var(--muted)}.search input{width:100%;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:13px}.search input::placeholder{color:var(--muted)}.search:focus-within{border-color:#8d9b7e}.search input:focus-visible{outline:0}.clear-search{border:0;background:none;padding:4px;color:var(--muted);display:none}.clear-search.visible{display:block}.clear-search svg{width:15px;height:15px}
    .product-list{display:flex;flex-direction:column;gap:24px}.product{background:var(--panel);border:1px solid #303235;border-radius:var(--radius);padding:24px;display:grid;grid-template-columns:minmax(0,.93fr) minmax(0,1.15fr);gap:32px;align-items:start}.gallery{min-width:0}.gallery-main{position:relative;aspect-ratio:16 / 10;background:#111415;border:1px solid #393d40;border-radius:8px;overflow:hidden}.gallery-open{border:0;background:none;padding:0;width:100%;height:100%;display:block;cursor:zoom-in}.gallery-open img{display:block;width:100%;height:100%;object-fit:contain}.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:40px;display:grid;place-items:center;border:1px solid #72787a55;border-radius:6px;background:#101315e8;color:#f2f3f2;transition:background .15s}.gallery-arrow:hover{background:#303637}.gallery-arrow.prev{left:10px}.gallery-arrow.next{right:10px}.gallery-arrow svg{width:17px;height:17px}.gallery-footer{height:32px;display:flex;align-items:center;justify-content:space-between;padding-top:12px;color:var(--muted);font-size:11px}.slide-dots{display:flex;gap:6px;align-items:center}.slide-dot{padding:0;width:6px;height:6px;border:0;border-radius:3px;background:#56595c}.slide-dot.active{width:16px;background:var(--accent)}.image-hint{display:flex;gap:5px;align-items:center}.image-hint svg{width:12px;height:12px}.slide-count{font-variant-numeric:tabular-nums;min-width:28px;text-align:right}.product-info{min-width:0;padding:0 0 4px}.product-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin-bottom:12px}.meta-divider{width:3px;height:3px;border-radius:50%;background:#696c70}.product h2{font-size:22px;line-height:1.45;letter-spacing:-.4px;font-weight:600;margin:0 0 16px;overflow-wrap:anywhere}.description{color:var(--secondary);font-size:14px;line-height:1.9;overflow-wrap:anywhere}.description p{margin:0 0 12px}.description p:last-child{margin-bottom:0}.product-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.action{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:6px;font-size:13px;font-weight:600;transition:background .15s,border-color .15s}.action svg{width:16px;height:16px}.download{border:1px solid #4c5054;background:#26292c;color:var(--text)}.download:hover{background:#33373b;border-color:#70757a}.purchase{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}.purchase:hover{background:#dbe8c8;border-color:#dbe8c8}
    .pagination-wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 0;color:var(--muted);font-size:12px}.pagination{display:flex;align-items:center;gap:8px}.page-button{min-width:34px;height:34px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--secondary);padding:0 10px;font-size:12px}.page-button:hover:not(:disabled){background:var(--raised)}.page-button.current{background:#30382b;color:#e0e9d6;border-color:#49533f}.page-button.wide{border-color:#393c40}.footer{border-top:1px solid #292c2f;padding:24px 0 12px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:12px}.empty{padding:80px 24px;text-align:center;border:1px solid var(--line);border-radius:12px;color:var(--secondary)}.empty h2{font-size:20px;color:var(--text);margin:0 0 12px}.empty button{margin:24px auto 0}.mobile-backdrop{display:none}.back-top{position:fixed;right:20px;bottom:20px;width:40px;height:40px;border:1px solid #44484b;border-radius:8px;background:#242729;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .15s}.back-top.visible{opacity:1;pointer-events:auto}
    dialog{border:1px solid #494c50;border-radius:12px;background:#1c1e20;color:var(--text);padding:28px;max-width:440px;width:calc(100% - 40px)}dialog::backdrop{background:#000b}dialog h2{font-size:20px;margin:0 0 16px}dialog p{color:var(--secondary);line-height:1.8;margin:8px 0}dialog .action{margin:24px 0 0 auto}.lightbox{max-width:1180px;width:calc(100% - 32px);padding:16px}.lightbox-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:16px}.lightbox-head h2{margin:0;font-size:16px}.close-button{display:grid;place-items:center;border:1px solid #44494d;background:#292c2f;border-radius:6px;width:36px;height:36px}.lightbox-picture{width:100%;max-height:75vh;display:block;object-fit:contain;background:#101315}.lightbox-controls{display:flex;gap:20px;justify-content:center;align-items:center;margin-top:16px}.lightbox-controls button{height:36px;border:1px solid #4a4e52;background:#2a2d30;border-radius:6px;padding:0 12px}.lightbox-controls span{color:var(--secondary);font-size:13px}
    @media(min-width:1600px){main{padding-top:44px}.product{gap:40px;padding:28px}.product h2{font-size:24px}}
    @media(max-width:1100px){.sidebar{width:192px}.shell{margin-left:192px}.topbar{padding:0 28px}main{padding:28px}.product{padding:20px;gap:24px;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}.product h2{font-size:20px}.description{font-size:13px}.search{width:230px}.topbar-note{display:none}}
    @media(max-width:820px){.sidebar{transform:translateX(-100%);transition:transform .18s;width:248px;padding-top:28px}.sidebar.open{transform:translateX(0)}.sidebar-close{position:absolute;right:14px;top:28px;border:0;background:none;padding:6px;display:block;color:var(--muted)}.sidebar .brand{margin-left:8px}.shell{margin-left:0}.mobile-menu{display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 0;font-size:14px}.mobile-menu svg{width:18px;height:18px}.breadcrumb{display:none}.topbar{height:64px;padding:0 24px}.mobile-backdrop.open{display:block;position:fixed;inset:0;background:#0009;z-index:29}main{padding:28px 24px 20px}.catalog-head{gap:16px}.search{width:240px}.product{gap:24px}.description{font-size:14px}.product h2{font-size:21px}}
    @media(max-width:600px){.topbar{padding:0 20px}.catalog-head{align-items:stretch;flex-direction:column;margin-bottom:20px;gap:20px}h1{font-size:26px}.search{width:100%}main{padding:24px 16px 16px}.product{display:flex;flex-direction:column;padding:16px;gap:20px;border-radius:10px}.gallery,.product-info{width:100%}.gallery-main{aspect-ratio:16 / 10}.gallery-footer{padding-top:10px;height:28px}.product-list{gap:20px}.product-meta{margin-bottom:10px}.product h2{font-size:21px;margin-bottom:12px}.description{font-size:14px;line-height:1.9}.product-actions{margin-top:20px;gap:12px}.action{min-height:44px;flex:1;padding:0 12px}.pagination-wrap{align-items:center;flex-direction:column;padding:24px 0;gap:16px}.footer{font-size:11px;flex-direction:column;gap:8px}.image-hint{font-size:10px}.back-top{bottom:16px;right:16px}.lightbox{padding:12px}.lightbox-head h2{font-size:14px}.lightbox-controls{gap:12px}.lightbox-controls button{padding:0 8px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="mobile-backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar" aria-label="软件分类">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5h6v6H5zM14 5h5v6h-5zM5 14h6v5H5zM14 14h5v5h-5z"/></svg></span>软件集</div>
    <button class="sidebar-close" id="closeNav" aria-label="关闭分类"></button>
    <p class="nav-label">软件分类</p>
    <nav class="category-list" id="categories"></nav>
    <div class="sidebar-bottom"><strong>找到适合你的工具</strong>浏览介绍，下载软件。<br>购买卡密后即可在软件中激活。</div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <button class="mobile-menu" id="openNav" aria-controls="sidebar" aria-expanded="false"></button>
      <div class="breadcrumb"><span>软件目录</span><span class="breadcrumb-separator">/</span><span id="crumb">英雄联盟</span></div>
      <div class="topbar-right"><span class="topbar-note">看介绍 · 下载 · 购买卡密</span><span class="preview-label">本地预览 · 示例内容</span></div>
    </header>
    <main id="catalog">
      <div class="catalog-head">
        <div class="page-title"><h1 id="pageTitle">英雄联盟</h1><span class="result-count" id="resultCount"></span></div>
        <label class="search"><span id="searchIcon" aria-hidden="true"></span><span class="visually-hidden">搜索全部软件</span><input id="search" type="search" placeholder="搜索全部软件…" autocomplete="off"><button class="clear-search" id="clearSearch" type="button" aria-label="清空搜索"></button></label>
      </div>
      <section class="product-list" id="products" aria-label="软件展示"></section>
      <div class="pagination-wrap" id="pagination"></div>
      <footer class="footer"><span>软件集 · 每一款工具，介绍清楚再选择。</span><span>当前为版式预览，软件与图片均为示例。</span></footer>
    </main>
  </div>
  <button class="back-top" id="backTop" aria-label="返回顶部"></button>
  <dialog id="actionDialog" aria-labelledby="actionTitle"><h2 id="actionTitle"></h2><p id="actionCopy"></p><p>当前是展示预览，尚未配置真实下载和购买地址。</p><button class="action purchase" id="closeAction">知道了</button></dialog>
  <dialog class="lightbox" id="lightbox" aria-labelledby="lightboxTitle"><div class="lightbox-head"><h2 id="lightboxTitle"></h2><button class="close-button" id="closeLightbox" aria-label="关闭大图"></button></div><img class="lightbox-picture" id="lightboxImage" alt=""><div class="lightbox-controls"><button id="lightboxPrev">上一张</button><span id="lightboxCount"></span><button id="lightboxNext">下一张</button></div></dialog>
  <script>
    'use strict';
    const paths={grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',game:'M7 8h10a4 4 0 0 1 3.9 3.1l1 5a2.5 2.5 0 0 1-4.1 2.4L15 16H9l-2.8 2.5a2.5 2.5 0 0 1-4.1-2.4l1-5A4 4 0 0 1 7 8ZM7 10v5M4.5 12.5h5M16 11h.01M18 14h.01',target:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10ZM12 10v4M10 12h4',tool:'M14 6a4 4 0 0 0-5 5L3 17l4 4 6-6a4 4 0 0 0 5-5l-3 3-4-4 3-3Z',download:'M12 3v12M7 10l5 5 5-5M4 16v5h16v-5',external:'M14 3h7v7M21 3l-9 9M10 5H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6',left:'m14 6-6 6 6 6',right:'m10 6 6 6-6 6',close:'m6 6 12 12M6 18 18 6',search:'M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15ZM16 16l5 5',menu:'M4 6h16M4 12h16M4 18h16',zoom:'M9 3H3v6M15 3h6v6M3 15v6h6M21 15v6h-6',up:'m6 14 6-6 6 6'};
    const icon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.grid}"/></svg>`;
    const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const categories=[{id:'all',name:'全部软件',icon:'grid'},{id:'lol',name:'英雄联盟',icon:'game'},{id:'cs',name:'CS / 反恐精英',icon:'target'},{id:'tools',name:'其他工具',icon:'tool'}];
    const products=[
      {id:1,category:'lol',name:'联盟画面配置管理器',sub:'画面配置',color:'#9aaf85',screen:'config',slides:3,paragraphs:['把分辨率、窗口模式、画面质量和常用按键配置整理在一起。为日常排位、训练与录制分别保存方案，需要时切换使用。','支持导入、导出与本地备份。更换电脑或重新安装后，可以找回自己熟悉的配置，减少重复设置。']},
      {id:2,category:'lol',name:'训练笔记与对局复盘',sub:'训练记录',color:'#9eadd0',screen:'notes',slides:2,paragraphs:['把每次训练遇到的问题、对局中的关键节点和下一次要练习的内容，记录到同一个地方。可以按英雄、位置和日期整理，不用在聊天记录与零散文档之间来回查找。','每条记录支持填写对线思路、补刀目标、视野习惯与团战复盘，也可以附上自己的截图。训练结束后，将需要继续练习的项目加入下一次计划，逐步形成自己的复盘习惯。','已有记录可以通过关键词快速查找，也支持导出备份。适合希望长期整理训练资料的玩家，以及需要按不同英雄保存笔记的用户。内容在本地管理，不需要给每一篇笔记重新选择保存位置。']},
      {id:3,category:'lol',name:'回放文件整理工具',sub:'文件整理',color:'#beac8d',screen:'files',slides:1,paragraphs:['按日期、英雄与自定义标签整理回放文件，快速找到想重新观看的那场对局。支持批量重命名和打开所在文件夹。']},
      {id:4,category:'lol',name:'阵容与英雄备忘录',sub:'资料整理',color:'#9aaf85',screen:'notes',slides:2,paragraphs:['保存自己的阵容思路、英雄组合与练习重点。每个主题单独整理，常用内容可以置顶。','可以为不同位置建立独立的备忘录，也可以把截图与文字放在同一条记录中，查找时一眼看清。']},
      {id:5,category:'lol',name:'游戏录制文件助手',sub:'录制管理',color:'#9eadd0',screen:'files',slides:2,paragraphs:['集中浏览本地录制的视频，按日期与文件大小筛选，给精彩片段添加备注。','支持将选中的片段复制到指定目录。整理前先预览文件信息，让素材归档更方便。']},
      {id:6,category:'lol',name:'常用配置备份工具',sub:'配置备份',color:'#beac8d',screen:'config',slides:1,paragraphs:['为常用游戏配置创建本地备份，并为每次备份添加说明。更换设置之前先保存一份，之后可以查看历史记录。']},
      {id:7,category:'lol',name:'训练计划清单',sub:'训练记录',color:'#9aaf85',screen:'notes',slides:2,paragraphs:['把训练目标拆成清楚的小任务，按今天、本周和长期计划分别整理。','每项任务可以记录完成情况与训练心得。想回顾过去的练习时，可以按日期查看自己的记录。']},
      {id:8,category:'lol',name:'游戏截图归档',sub:'文件整理',color:'#9eadd0',screen:'files',slides:1,paragraphs:['将分散在不同文件夹里的截图集中归档，支持标签、备注和按日期查找。选中图片即可预览，整理素材更直观。']},
      {id:9,category:'lol',name:'设备设置备忘录',sub:'配置记录',color:'#beac8d',screen:'config',slides:2,paragraphs:['记录鼠标灵敏度、显示器设置和外设配置，给不同设备分别保存一份设置清单。','更换设备后可以逐项对照，省去重新回忆参数的时间。']},
      {id:10,category:'lol',name:'英雄资料收藏夹',sub:'资料整理',color:'#9aaf85',screen:'notes',slides:1,paragraphs:['把常看的攻略链接和自己的阅读笔记按英雄归类。标题、链接与备注集中保存，之后查找更方便。']},
      {id:11,category:'cs',name:'准星配置收藏夹',sub:'配置管理',color:'#c0ae8e',screen:'config',slides:3,paragraphs:['保存和对比自己的准星配置，为每套方案添加名称与说明，按习惯整理成个人收藏。','支持配置文本的导入与导出。切换之前可以先查看参数，保留每次调整的记录。']},
      {id:12,category:'cs',name:'地图训练笔记',sub:'训练记录',color:'#9eadd0',screen:'notes',slides:2,paragraphs:['按地图整理自己的训练笔记、路线截图和练习计划，常用资料可以随时查找。','每个主题都可以记录文字与图片。适合将零散的训练心得整理成一份长期可用的个人资料库。']},
      {id:13,category:'cs',name:'录像与素材管理器',sub:'文件整理',color:'#9aaf85',screen:'files',slides:1,paragraphs:['管理本地录像和剪辑素材，按时间、标签与文件夹归类。支持批量添加备注，快速打开文件位置。']},
      {id:14,category:'tools',name:'桌面文件整理助手',sub:'桌面工具',color:'#9eadd0',screen:'files',slides:2,paragraphs:['按文件类型整理下载目录，为文档、图片、压缩包设置独立的归档位置。','执行前可以预览整理结果，确认后再进行操作。常用规则可以保存，下次继续使用。']},
      {id:15,category:'tools',name:'轻量工作笔记',sub:'效率工具',color:'#beac8d',screen:'notes',slides:1,paragraphs:['打开就能记录的小型笔记工具，支持按主题分类与关键词搜索。把临时想法、待办和常用信息放在一起。']}
    ];
    let state={category:'lol',page:1,query:''};
    const pageSize=8,slideIndexes=new Map();let lightboxId=null,lastFocused=null;
    function screenImage(product,slide=0){
      const c=product.color,title=esc(product.name),mode=slide===1?'历史记录':slide===2?'配置预览':product.sub;
      let content='';
      if(product.screen==='notes'){
        content=`<text x="186" y="122" fill="#e1e4e1" font-size="22" font-weight="600">${slide?'本周训练回顾':'今天的训练笔记'}</text><text x="186" y="150" fill="#969e9e" font-size="12">个人记录 / ${slide?'历史归档':'日常练习'}</text>`;
        const lines=['对线练习与目标','记录今天的训练重点，整理需要继续练习的内容。','复盘与改进','查看上一场的记录，为下一次训练留下清楚的计划。','资料与截图','将常用资料放在一起，保持自己的记录井然有序。'];
        lines.forEach((v,i)=>{const y=196+i*36;content+=`<text x="186" y="${y}" fill="${i%2===0?'#d0d6d1':'#9ba3a0'}" font-size="${i%2===0?15:12}" ${i%2===0?'font-weight="600"':''}>${v}</text>`;});
      }else if(product.screen==='files'){
        content=`<text x="186" y="122" fill="#e1e4e1" font-size="22" font-weight="600">${slide?'文件归档':'我的文件'}</text><rect x="186" y="143" width="405" height="32" rx="5" fill="#242a2e"/><text x="199" y="164" fill="#9aa3a4" font-size="11">文件名称</text><text x="474" y="164" fill="#9aa3a4" font-size="11">修改时间</text>`;
        ['排位训练 · 第一场','个人收藏 · 精彩片段','训练资料 · 今日记录','配置文件 · 本地备份'].forEach((v,i)=>{const y=190+i*47;content+=`<rect x="190" y="${y}" width="26" height="30" rx="4" fill="${c}" fill-opacity=".14"/><path d="M198 ${y+8}h10m-10 6h10m-10 6h6" stroke="${c}"/><text x="230" y="${y+18}" font-size="12" fill="#c2cac8">${v}</text><text x="475" y="${y+18}" font-size="10" fill="#8a9598">11 / ${16-i}</text><path d="M186 ${y+40}h405" stroke="#2d3438"/>`;});
      }else{
        content=`<text x="186" y="122" fill="#e1e4e1" font-size="22" font-weight="600">${slide?'方案管理':'画面与常用配置'}</text><text x="186" y="150" fill="#969e9e" font-size="12">为不同场景，保存熟悉的设置。</text>`;
        ['窗口显示模式','画面分辨率','画面质量','配置自动备份'].forEach((v,i)=>{const y=185+i*46;content+=`<text x="186" y="${y+17}" fill="#bdc6c3" font-size="12">${v}</text><rect x="390" y="${y}" width="200" height="30" rx="5" fill="#262d31" stroke="#3c4549"/><text x="403" y="${y+19}" fill="${i===3?c:'#c1cac6'}" font-size="11">${['无边框窗口','2560 × 1440','自定义方案','已开启'][i]}</text><path d="m570 ${y+12} 4 4 4-4" fill="none" stroke="#899497"/>`;});
      }
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="#13191c"/><rect width="640" height="38" fill="#252c30"/><circle cx="17" cy="19" r="4" fill="#889782"/><text x="31" y="24" fill="#c4ccc8" font-family="Microsoft YaHei,Arial,sans-serif" font-size="11">${title}</text><path d="M578 18h10m16-4 8 8m-8 0 8-8" stroke="#8a9496"/><rect y="38" width="154" height="362" fill="#192024"/><text x="22" y="80" fill="${c}" font-size="16" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="600">我的工作台</text><rect x="12" y="103" width="130" height="36" rx="5" fill="${c}" fill-opacity=".13"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="12"><text x="27" y="126" fill="${c}">${mode}</text><text x="27" y="169" fill="#8e9b9d">我的方案</text><text x="27" y="212" fill="#8e9b9d">本地备份</text><text x="27" y="255" fill="#8e9b9d">偏好设置</text><text x="22" y="374" fill="#7e8c8e" font-size="10">本地保存</text>${content}</g><text x="585" y="386" fill="#718087" font-size="9" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif">界面示意 · ${slide+1}</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }
    function renderCategories(){document.getElementById('categories').innerHTML=categories.map(c=>`<button class="category ${state.category===c.id&&!state.query?'active':''}" data-category="${c.id}" ${state.category===c.id&&!state.query?'aria-current="true"':''}>${icon(c.icon)}<span class="category-name">${c.name}</span><span class="category-count">${products.filter(p=>c.id==='all'||p.category===c.id).length}</span></button>`).join('');}
    function productHTML(p){const slide=slideIndexes.get(p.id)||0;return `<article class="product" data-id="${p.id}" aria-labelledby="title-${p.id}"><div class="gallery"><div class="gallery-main"><button class="gallery-open" data-action="image" aria-label="放大查看${esc(p.name)}图片"><img src="${screenImage(p,slide)}" alt="${esc(p.name)}的${esc(p.sub)}界面示意，第${slide+1}张" ${p.id===1?'fetchpriority="high"':'loading="lazy"'} width="640" height="400"></button>${p.slides>1?`<button class="gallery-arrow prev" data-action="prev" aria-label="上一张图片">${icon('left')}</button><button class="gallery-arrow next" data-action="next" aria-label="下一张图片">${icon('right')}</button>`:''}</div><div class="gallery-footer"><div class="slide-dots">${Array.from({length:p.slides},(_,i)=>`<button class="slide-dot ${i===slide?'active':''}" data-action="slide" data-slide="${i}" aria-label="查看第${i+1}张图片" aria-pressed="${i===slide}"></button>`).join('')}</div><span class="image-hint">${icon('zoom')}点击图片放大</span><span class="slide-count">${slide+1} / ${p.slides}</span></div></div><div class="product-info"><div class="product-meta"><span>${categories.find(c=>c.id===p.category).name}</span><span class="meta-divider"></span><span>${p.sub}</span></div><h2 id="title-${p.id}">${esc(p.name)}</h2><div class="description">${p.paragraphs.map(s=>`<p>${esc(s)}</p>`).join('')}</div><div class="product-actions"><button class="action download" data-action="download">${icon('download')}下载软件</button><button class="action purchase" data-action="purchase">购买卡密${icon('external')}</button></div></div></article>`;}
    function render(scroll=false){
      const query=state.query.toLowerCase(),filtered=products.filter(p=>query?[p.name,p.sub,...p.paragraphs].join(' ').toLowerCase().includes(query):state.category==='all'||p.category===state.category),pages=Math.max(1,Math.ceil(filtered.length/pageSize));state.page=Math.min(state.page,pages);
      const start=(state.page-1)*pageSize,list=filtered.slice(start,start+pageSize),name=query?'搜索结果':categories.find(c=>c.id===state.category).name;
      document.getElementById('pageTitle').textContent=name;document.getElementById('crumb').textContent=name;document.getElementById('resultCount').textContent=`共 ${filtered.length} 款软件`;
      document.getElementById('products').innerHTML=list.length?list.map(productHTML).join(''):`<div class="empty"><h2>没有找到相关软件</h2><p>换一个名称或功能关键词试试。</p><button class="action download" data-action="reset">查看全部软件</button></div>`;
      document.getElementById('pagination').innerHTML=filtered.length?`<span>正在显示 ${start+1}–${Math.min(start+pageSize,filtered.length)} 款，共 ${filtered.length} 款</span>${pages>1?`<nav class="pagination" aria-label="软件列表分页"><button class="page-button wide" data-page="${state.page-1}" ${state.page===1?'disabled':''}>上一页</button>${Array.from({length:pages},(_,i)=>`<button class="page-button ${state.page===i+1?'current':''}" data-page="${i+1}" ${state.page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="page-button wide" data-page="${state.page+1}" ${state.page===pages?'disabled':''}>下一页</button></nav>`:''}`:'';
      document.getElementById('clearSearch').classList.toggle('visible',!!state.query);renderCategories();if(scroll)window.scrollTo({top:0,behavior:'instant'});
    }
    function updateSlide(id,delta,exact){const p=products.find(p=>p.id===id);slideIndexes.set(id,exact===undefined?((slideIndexes.get(id)||0)+delta+p.slides)%p.slides:exact);const article=document.querySelector(`[data-id="${id}"]`);if(article){const slide=slideIndexes.get(id);article.querySelector('img').src=screenImage(p,slide);article.querySelector('img').alt=`${p.name}的${p.sub}界面示意，第${slide+1}张`;article.querySelector('.slide-count').textContent=`${slide+1} / ${p.slides}`;article.querySelectorAll('.slide-dot').forEach((dot,i)=>{dot.classList.toggle('active',i===slide);dot.setAttribute('aria-pressed',i===slide?'true':'false');});}if(document.getElementById('lightbox').open)updateLightbox();}
    function updateLightbox(){const p=products.find(p=>p.id===lightboxId),slide=slideIndexes.get(p.id)||0;document.getElementById('lightboxTitle').textContent=p.name;const img=document.getElementById('lightboxImage');img.src=screenImage(p,slide);img.alt=`${p.name}界面示意，第${slide+1}张`;document.getElementById('lightboxCount').textContent=`${slide+1} / ${p.slides}`;document.getElementById('lightboxPrev').disabled=p.slides===1;document.getElementById('lightboxNext').disabled=p.slides===1;}
    function setNav(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('backdrop').classList.toggle('open',open);document.getElementById('openNav').setAttribute('aria-expanded',String(open));document.body.style.overflow=open?'hidden':'';if(open)document.getElementById('closeNav').focus();}
    function reset(){state={category:'all',query:'',page:1};document.getElementById('search').value='';render(true);}
    document.getElementById('products').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const action=button.dataset.action;if(action==='reset'){reset();return;}const p=products.find(p=>p.id===Number(button.closest('[data-id]').dataset.id));if(action==='prev'||action==='next'||action==='slide'){updateSlide(p.id,action==='prev'?-1:1,action==='slide'?Number(button.dataset.slide):undefined);return;}if(action==='image'){lightboxId=p.id;lastFocused=button;updateLightbox();document.getElementById('lightbox').showModal();return;}if(action==='download'||action==='purchase'){document.getElementById('actionTitle').textContent=action==='download'?'下载软件':'购买卡密';document.getElementById('actionCopy').textContent=action==='download'?`正式版将下载「${p.name}」对应的软件包。每款软件的下载链接可单独设置。`:`正式版将打开「${p.name}」对应的卡密购买网站。每款软件的购买网址可单独设置。`;document.getElementById('actionDialog').showModal();}});
    let swipeStart=null;
    document.getElementById('products').addEventListener('touchstart',event=>{const gallery=event.target.closest('.gallery-main');if(gallery&&event.touches.length===1)swipeStart={id:Number(gallery.closest('[data-id]').dataset.id),x:event.touches[0].clientX,y:event.touches[0].clientY};else swipeStart=null;},{passive:true});
    document.getElementById('products').addEventListener('touchend',event=>{if(!swipeStart)return;const start=swipeStart;swipeStart=null;const touch=event.changedTouches[0],dx=touch.clientX-start.x,dy=touch.clientY-start.y;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.5&&products.find(p=>p.id===start.id).slides>1){event.preventDefault();updateSlide(start.id,dx<0?1:-1);}},{passive:false});
    document.getElementById('products').addEventListener('touchcancel',()=>{swipeStart=null;},{passive:true});
    document.getElementById('categories').addEventListener('click',event=>{const b=event.target.closest('[data-category]');if(!b)return;state={category:b.dataset.category,page:1,query:''};document.getElementById('search').value='';setNav(false);render(true);});
    document.getElementById('search').addEventListener('input',event=>{state.query=event.target.value.trim();state.page=1;render();});
    document.getElementById('clearSearch').addEventListener('click',()=>{state.query='';state.page=1;document.getElementById('search').value='';render();document.getElementById('search').focus();});
    document.getElementById('pagination').addEventListener('click',event=>{const b=event.target.closest('[data-page]');if(b&&!b.disabled){state.page=Number(b.dataset.page);render(true);}});
    document.getElementById('openNav').innerHTML=icon('menu')+'软件分类';document.getElementById('closeNav').innerHTML=icon('close');document.getElementById('searchIcon').innerHTML=icon('search');document.getElementById('clearSearch').innerHTML=icon('close');document.getElementById('backTop').innerHTML=icon('up');document.getElementById('closeLightbox').innerHTML=icon('close');
    document.getElementById('openNav').onclick=()=>setNav(true);document.getElementById('closeNav').onclick=()=>{setNav(false);document.getElementById('openNav').focus();};document.getElementById('backdrop').onclick=()=>setNav(false);
    document.getElementById('closeAction').onclick=()=>document.getElementById('actionDialog').close();document.getElementById('closeLightbox').onclick=()=>document.getElementById('lightbox').close();document.getElementById('lightbox').addEventListener('close',()=>lastFocused?.focus());
    document.getElementById('lightboxPrev').onclick=()=>updateSlide(lightboxId,-1);document.getElementById('lightboxNext').onclick=()=>updateSlide(lightboxId,1);
    for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){setNav(false);}if(document.getElementById('lightbox').open){if(e.key==='ArrowLeft')updateSlide(lightboxId,-1);if(e.key==='ArrowRight')updateSlide(lightboxId,1);}});
    document.getElementById('backTop').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});window.addEventListener('scroll',()=>document.getElementById('backTop').classList.toggle('visible',scrollY>600),{passive:true});window.addEventListener('resize',()=>{if(innerWidth>820)setNav(false);});
    render();
  </script>
</body>
</html>
