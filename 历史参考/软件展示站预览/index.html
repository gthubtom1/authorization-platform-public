:root{
 --bg:#151719;--side:#101214;--panel:#1c1f21;--raised:#282d2f;
 --line:#3a4144;--text:#f0f1ee;--secondary:#c1c6c5;--muted:#a5afaf;
 --accent:#c9dbaf;--accent-ink:#21331b;--selected:#2b3429;--selected-text:#e1eed7;
 --field:#1b1e20;--hover:#2c3234;--border-control:#6c7778;--stage:#12191c;
 --nav-width:224px;--main-width:1312px;--radius:14px;--ease:cubic-bezier(.16,1,.3,1);
 color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:96px;scrollbar-color:#646e6e var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 Catalog,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--accent-ink)}
button,input,a{font:inherit;-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}button{color:inherit;cursor:pointer}button:disabled{opacity:.38;cursor:default}
button,a,input{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
button{transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
svg{display:block;width:20px;height:20px;flex-shrink:0;pointer-events:none}
a{color:inherit;text-underline-offset:4px}input{caret-color:var(--accent)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.skip-link{position:fixed;top:-80px;left:16px;padding:12px 20px;background:var(--accent);color:var(--accent-ink);z-index:100;border-radius:8px}
.skip-link:focus{top:12px}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--nav-width);padding:32px 16px 24px;background:var(--side);border-right:1px solid #2c3335;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:0 16px;margin-bottom:48px;font-size:22px;font-weight:700;letter-spacing:-.03em}
.brand-mark{display:grid;place-items:center;color:var(--accent);width:28px;height:28px}
.brand-mark svg{width:28px;height:28px}
.nav-label{margin:0 16px 12px;font-size:13px;color:var(--muted)}
.category-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;padding:4px}
.category{display:flex;align-items:center;gap:12px;padding:14px 12px;min-height:52px;background:transparent;border:1px solid transparent;border-radius:8px;width:100%;text-align:left;color:var(--secondary)}
.category svg{width:18px;height:18px}.category-name{flex:1;overflow-wrap:anywhere}
.category-count{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.category:hover{background:var(--hover);color:var(--text)}
.category.active{background:var(--selected);color:var(--selected-text);border-color:#414e3b}
.category.active .category-count{color:var(--selected-text)}
.sidebar-bottom{margin-top:auto;padding:32px 16px 0;font-size:12px;line-height:1.9;color:var(--muted)}
.sidebar-bottom strong{display:block;font-size:13px;font-weight:500;color:var(--secondary);margin-bottom:8px}
.sidebar-close{display:none}.shell{margin-left:var(--nav-width)}
.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 40px;background:var(--bg)}
.breadcrumb{display:flex;gap:12px;color:var(--muted);font-size:13px;align-items:center}.breadcrumb span:last-child{color:var(--secondary)}
.breadcrumb-separator{opacity:.5}.topbar-right{display:flex;gap:16px;align-items:center}
.preview-label{font-size:12px;color:var(--muted);white-space:nowrap}.variant-switch{display:flex;gap:4px;padding:4px;background:var(--side);border:1px solid var(--line);border-radius:8px}
.variant-switch a{padding:6px 12px;min-height:36px;text-decoration:none;font-size:12px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--muted)}
.variant-switch a:hover{background:var(--hover);color:var(--text)}.variant-switch a[aria-current]{background:var(--raised);color:var(--text)}
.mobile-menu{display:none}
main{max-width:var(--main-width);margin:auto;padding:40px 40px 24px;min-height:calc(100vh - 72px)}
.catalog-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:32px}
.page-title{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:32px;line-height:1.3;font-weight:700;letter-spacing:-.03em;margin:0;text-wrap:balance}
h1:focus{outline:none}.result-count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:12px;width:280px;min-height:48px;background:var(--field);border:1px solid var(--border-control);border-radius:8px;padding:2px 14px;flex-shrink:0}
.search>svg{width:18px;height:18px;color:var(--muted)}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0;color:var(--text);font-size:14px;min-height:42px}
.search input::placeholder{color:var(--muted)}.search:focus-within{outline:2px solid var(--accent);outline-offset:3px}.search input:focus-visible{outline:none}
.search input::-webkit-search-cancel-button{display:none}.clear-search{display:none;place-items:center;background:none;border:0;width:36px;height:40px;padding:0;flex-shrink:0;color:var(--secondary)}.clear-search.visible{display:grid}.clear-search svg{width:18px;height:18px}
.product-list{display:flex;flex-direction:column;gap:28px}
.product{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.16fr);gap:32px;align-items:start;padding:28px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.gallery{min-width:0;position:sticky;top:24px}
.gallery-main{position:relative;aspect-ratio:16/10;border-radius:8px;background:var(--stage);overflow:hidden}
.gallery-open{display:block;padding:0;border:0;background:none;width:100%;height:100%;cursor:zoom-in}
.gallery-open img{display:block;width:100%;height:100%;object-fit:contain}
.gallery-open:hover .zoom-indicator{background:#26323b;color:#fff}
.zoom-indicator{position:absolute;right:12px;top:12px;width:36px;height:36px;display:grid;place-items:center;background:#10191fdf;color:#e5eded;border-radius:6px;transition:background-color .18s var(--ease)}
.zoom-indicator svg{width:16px;height:16px}
.gallery-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding-top:8px;color:var(--muted);font-size:12px}
.gallery-caption{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}.gallery-caption .counter-divider{opacity:.55}
.gallery-controls{display:flex;gap:8px}.gallery-arrow{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--border-control);background:transparent;border-radius:6px;color:var(--secondary)}
.gallery-arrow:hover{background:var(--hover);color:var(--text)}.gallery-arrow svg{width:17px;height:17px}
.single-image-note{font-size:12px;color:var(--muted)}
.product-info{min-width:0;padding:0 0 4px}
.product h2{font-size:25px;line-height:1.4;font-weight:600;letter-spacing:-.025em;text-wrap:balance;margin:0 0 8px;overflow-wrap:anywhere}
.product-meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:20px;flex-wrap:wrap}
.meta-divider{width:3px;height:3px;background:var(--muted);border-radius:50%}
.description{font-size:15px;line-height:1.95;color:var(--secondary);overflow-wrap:anywhere;max-width:72ch}
.description p{margin:0 0 14px}.description p:last-child{margin-bottom:0}
.product-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.action{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 20px;border-radius:7px;font-size:14px;font-weight:600;text-decoration:none;min-width:136px}
.action svg{width:17px;height:17px}.download{background:transparent;border:1px solid var(--border-control);color:var(--text)}
.download:hover{background:var(--hover)}.purchase{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.purchase:hover{background:#e0eccc;border-color:#e0eccc}
.action-feedback{position:relative;font-size:13px;line-height:1.8;color:var(--secondary);margin-top:16px;padding:14px 44px 14px 16px;background:var(--raised);border-radius:8px;overflow-wrap:anywhere}
.action-feedback[hidden]{display:none}.feedback-close{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;display:grid;place-items:center;color:var(--secondary)}.feedback-close svg{width:16px;height:16px}
.pagination-wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:32px 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pagination{display:flex;gap:8px;align-items:center}.page-button{height:44px;min-width:44px;padding:0 12px;background:none;border:1px solid transparent;border-radius:7px;color:var(--secondary);font-size:13px}
.page-button:hover:not(:disabled){background:var(--hover)}.page-button.current{background:var(--selected);color:var(--selected-text);border-color:#56634c}.page-button.wide{border-color:var(--border-control)}
.footer{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:24px 0 8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.footer a{white-space:nowrap;text-underline-offset:4px}

      }else{
        content=`<text x="186" y="122" fill="#e1e4e1" font-size="22" font-weight="600">${slide?'方案管理':'画面与常用配置'}</text><text x="186" y="150" fill="#969e9e" font-size="12">为不同场景，保存熟悉的设置。</text>`;
        ['窗口显示模式','画面分辨率','画面质量','配置自动备份'].forEach((v,i)=>{const y=185+i*46;content+=`<text x="186" y="${y+17}" fill="#bdc6c3" font-size="12">${v}</text><rect x="390" y="${y}" width="200" height="30" rx="5" fill="#262d31" stroke="#3c4549"/><text x="403" y="${y+19}" fill="${i===3?c:'#c1cac6'}" font-size="11">${['无边框窗口','2560 × 1440','自定义方案','已开启'][i]}</text><path d="m570 ${y+12} 4 4 4-4" fill="none" stroke="#899497"/>`;});
      }
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><rect width="640" height="400" fill="#13191c"/><rect width="640" height="38" fill="#252c30"/><circle cx="17" cy="19" r="4" fill="#889782"/><text x="31" y="24" fill="#c4ccc8" font-family="Microsoft YaHei,Arial,sans-serif" font-size="11">${title}</text><path d="M578 18h10m16-4 8 8m-8 0 8-8" stroke="#8a9496"/><rect y="38" width="154" height="362" fill="#192024"/><text x="22" y="80" fill="${c}" font-size="16" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="600">我的工作台</text><rect x="12" y="103" width="130" height="36" rx="5" fill="${c}" fill-opacity=".13"/><g font-family="Microsoft YaHei,Arial,sans-serif" font-size="12"><text x="27" y="126" fill="${c}">${mode}</text><text x="27" y="169" fill="#8e9b9d">我的方案</text><text x="27" y="212" fill="#8e9b9d">本地备份</text><text x="27" y="255" fill="#8e9b9d">偏好设置</text><text x="22" y="374" fill="#7e8c8e" font-size="10">本地保存</text>${content}</g><text x="585" y="386" fill="#718087" font-size="9" text-anchor="end" font-family="Microsoft YaHei,Arial,sans-serif">界面示意 · ${slide+1}</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }

 function categoryName(id){return categories.find(c=>c.id===id)?.name||'全部软件';}
 function readURL(){const p=new URLSearchParams(location.search),category=p.get('category');state={category:categories.some(c=>c.id===category)?category:'lol',page:Math.max(1,Number(p.get('page'))||1),query:(p.get('q')||'').slice(0,500)};document.getElementById('search').value=state.query;}
 function saveURL(push=false){const p=new URLSearchParams();p.set('category',state.category);if(state.page>1)p.set('page',state.page);if(state.query)p.set('q',state.query);const url=location.pathname+'?'+p;try{history[push?'pushState':'replaceState']({...state},'',url);}catch{}document.querySelectorAll('[data-variant]').forEach(a=>a.href=(a.dataset.variant==='a'?'index.html':'redesign.html')+'?'+p);}
 function renderCategories(){document.getElementById('categories').innerHTML=categories.map(c=>`<button class="category ${state.category===c.id&&!state.query?'active':''}" data-category="${c.id}" ${state.category===c.id&&!state.query?'aria-current="true"':''}>${icon(c.icon)}<span class="category-name">${c.name}</span><span class="category-count">${products.filter(p=>c.id==='all'||p.category===c.id).length}</span></button>`).join('');}
 function imageLabel(p,slide){return `${p.name}的${p.sub}界面示意，第${slide+1}张`;}
 function productHTML(p){const slide=slideIndexes.get(p.id)||0;return `<article class="product" data-id="${p.id}" aria-labelledby="title-${p.id}"><div class="gallery"><div class="gallery-main"><button class="gallery-open" data-action="image" aria-label="放大查看${esc(p.name)}图片"><img src="${screenImage(p,slide)}" alt="${esc(imageLabel(p,slide))}" ${p.id===1?'fetchpriority="high"':'loading="lazy"'} decoding="async" width="640" height="400"><span class="zoom-indicator">${icon('zoom')}</span></button></div><div class="gallery-footer"><div class="gallery-caption"><span>图片</span><span class="slide-count" aria-live="polite">${slide+1} / ${p.slides}</span></div>${p.slides>1?`<div class="gallery-controls"><button class="gallery-arrow prev" data-action="prev" aria-label="上一张图片">${icon('left')}</button><button class="gallery-arrow next" data-action="next" aria-label="下一张图片">${icon('right')}</button></div>`:'<span class="single-image-note">点击图片查看大图</span>'}</div></div><div class="product-info"><h2 id="title-${p.id}">${esc(p.name)}</h2><div class="product-meta"><span>${categoryName(p.category)}</span><span class="meta-divider"></span><span>${p.sub}</span></div><div class="description">${p.paragraphs.map(s=>`<p>${esc(s)}</p>`).join('')}</div><div class="product-actions"><button class="action download" data-action="download">${icon('download')}下载软件</button><button class="action purchase" data-action="purchase">购买卡密${icon('external')}</button></div><div class="action-feedback" id="feedback-${p.id}" role="status" aria-live="polite" ${messages.has(p.id)?'':'hidden'}><span>${esc(messages.get(p.id)||'')}</span><button class="feedback-close" data-action="dismiss" aria-label="关闭预览提示">${icon('close')}</button></div></div></article>`;}
 function render({scroll=false,save=true,push=false}={}){const q=state.query.toLowerCase(),filtered=products.filter(p=>q?[p.name,p.sub,...p.paragraphs].join(' ').toLowerCase().includes(q):state.category==='all'||p.category===state.category),pages=Math.max(1,Math.ceil(filtered.length/pageSize));state.page=Math.min(state.page,pages);const start=(state.page-1)*pageSize,list=filtered.slice(start,start+pageSize),name=q?'搜索结果':categoryName(state.category);document.getElementById('pageTitle').textContent=name;document.getElementById('crumb').textContent=name;document.getElementById('resultCount').textContent=`共 ${filtered.length} 款软件`;document.getElementById('products').innerHTML=list.length?list.map(productHTML).join(''):`<div class="empty"><h2>没有找到相关软件</h2><p>换一个软件名称或功能关键词试试。</p><button class="action download" data-action="reset">查看全部软件</button></div>`;document.getElementById('pagination').innerHTML=filtered.length?`<span>正在显示 ${start+1}–${Math.min(start+pageSize,filtered.length)} 款，共 ${filtered.length} 款</span>${pages>1?`<nav class="pagination" aria-label="软件列表分页"><button class="page-button wide" data-page="${state.page-1}" ${state.page===1?'disabled':''}>上一页</button>${Array.from({length:pages},(_,i)=>`<button class="page-button ${state.page===i+1?'current':''}" data-page="${i+1}" ${state.page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="page-button wide" data-page="${state.page+1}" ${state.page===pages?'disabled':''}>下一页</button></nav>`:''}`:'';document.getElementById('clearSearch').classList.toggle('visible',!!q);renderCategories();if(save)saveURL(push);if(scroll)window.scrollTo({top:0,behavior:'instant'});}
 function updateSlide(id,delta){const p=products.find(p=>p.id===id);slideIndexes.set(id,((slideIndexes.get(id)||0)+delta+p.slides)%p.slides);const a=document.querySelector(`[data-id="${id}"]`),slide=slideIndexes.get(id);if(a){const img=a.querySelector('img');img.src=screenImage(p,slide);img.alt=imageLabel(p,slide);a.querySelector('.slide-count').textContent=`${slide+1} / ${p.slides}`;}if(document.getElementById('lightbox').open)updateLightbox();}
 function updateLightbox(){const p=products.find(p=>p.id===lightboxId),slide=slideIndexes.get(p.id)||0;document.getElementById('lightboxTitle').textContent=p.name;const img=document.getElementById('lightboxImage');img.src=screenImage(p,slide);img.alt=imageLabel(p,slide);document.getElementById('lightboxCount').textContent=`${slide+1} / ${p.slides}`;for(const id of ['lightboxPrev','lightboxNext']){const button=document.getElementById(id);button.hidden=p.slides===1;button.disabled=p.slides===1;}}
 function setNav(open,restoreFocus=false){navOpen=open;const sidebar=document.getElementById('sidebar'),mobile=innerWidth<=900;sidebar.classList.toggle('open',open);document.getElementById('backdrop').classList.toggle('open',open);document.getElementById('openNav').setAttribute('aria-expanded',String(open));document.getElementById('shell').inert=open;sidebar.inert=mobile&&!open;document.body.style.overflow=open?'hidden':'';if(open){sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');document.getElementById('closeNav').focus();}else{sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');if(restoreFocus)document.getElementById('openNav').focus();}}
 function reset(){state={category:'all',query:'',page:1};document.getElementById('search').value='';render({scroll:true,push:true});document.getElementById('pageTitle').focus({preventScroll:true});}
 document.getElementById('products').addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;const action=b.dataset.action;if(action==='reset'){reset();return;}const p=products.find(p=>p.id===Number(b.closest('[data-id]').dataset.id));if(action==='prev'||action==='next'){updateSlide(p.id,action==='prev'?-1:1);return;}if(action==='image'){lightboxId=p.id;opener=b;updateLightbox();document.getElementById('lightbox').showModal();document.body.style.overflow='hidden';return;}const box=document.getElementById(`feedback-${p.id}`);if(action==='dismiss'){messages.delete(p.id);box.hidden=true;b.closest('.product-info').querySelector('.download').focus();return;}const message=action==='download'?`预览提示：正式版会下载「${p.name}」的软件包，目前还没有配置下载链接。`:`预览提示：正式版会打开「${p.name}」的卡密购买网站，目前还没有配置购买网址。`;messages.set(p.id,message);box.querySelector('span').textContent=message;box.hidden=false;});
 let swipeStart=null;const list=document.getElementById('products');list.addEventListener('touchstart',e=>{const g=e.target.closest('.gallery-main');swipeStart=g&&e.touches.length===1?{id:Number(g.closest('[data-id]').dataset.id),x:e.touches[0].clientX,y:e.touches[0].clientY}:null;},{passive:true});list.addEventListener('touchend',e=>{if(!swipeStart)return;const s=swipeStart;swipeStart=null;const t=e.changedTouches[0],dx=t.clientX-s.x,dy=t.clientY-s.y;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.5&&products.find(p=>p.id===s.id).slides>1){e.preventDefault();updateSlide(s.id,dx<0?1:-1);}},{passive:false});list.addEventListener('touchcancel',()=>swipeStart=null,{passive:true});
 document.getElementById('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;state={category:b.dataset.category,page:1,query:''};document.getElementById('search').value='';setNav(false);render({scroll:true,push:true});document.getElementById('pageTitle').focus({preventScroll:true});});
 document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value.trim();state.page=1;render();});
 document.getElementById('clearSearch').onclick=()=>{state.query='';state.page=1;document.getElementById('search').value='';render();document.getElementById('search').focus();};
 document.getElementById('pagination').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b||b.disabled)return;state.page=Number(b.dataset.page);render({scroll:true,push:true});document.getElementById('pageTitle').focus({preventScroll:true});});
 document.getElementById('openNav').innerHTML=icon('menu')+'分类';document.getElementById('closeNav').innerHTML=icon('close');document.getElementById('searchIcon').innerHTML=icon('search');document.getElementById('clearSearch').innerHTML=icon('close');document.getElementById('backTop').innerHTML=icon('up');document.getElementById('closeLightbox').innerHTML=icon('close');
 document.getElementById('openNav').onclick=()=>setNav(true);document.getElementById('closeNav').onclick=()=>setNav(false,true);document.getElementById('backdrop').onclick=()=>setNav(false,true);
 document.getElementById('closeLightbox').onclick=()=>document.getElementById('lightbox').close();document.getElementById('lightbox').addEventListener('close',()=>{document.body.style.overflow='';opener?.focus({preventScroll:true});});
 document.getElementById('lightboxPrev').onclick=()=>updateSlide(lightboxId,-1);document.getElementById('lightboxNext').onclick=()=>updateSlide(lightboxId,1);
 document.getElementById('lightbox').addEventListener('click',e=>{const d=e.currentTarget;if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();});
 document.addEventListener('keydown',e=>{if(navOpen){if(e.key==='Escape'){setNav(false,true);e.preventDefault();}if(e.key==='Tab'){const f=[...document.getElementById('sidebar').querySelectorAll('button,a')].filter(el=>el.getClientRects().length);if(e.shiftKey&&document.activeElement===f[0]){f.at(-1).focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===f.at(-1)){f[0].focus();e.preventDefault();}}}if(document.getElementById('lightbox').open){if(e.key==='ArrowLeft'){updateSlide(lightboxId,-1);e.preventDefault();}if(e.key==='ArrowRight'){updateSlide(lightboxId,1);e.preventDefault();}}});
 function syncTop(){const show=scrollY>600,b=document.getElementById('backTop');b.classList.toggle('visible',show);b.hidden=!show;b.tabIndex=show?0:-1;}
 document.getElementById('backTop').onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});window.addEventListener('scroll',syncTop,{passive:true});window.addEventListener('resize',()=>setNav(false));window.addEventListener('popstate',()=>{readURL();render({save:false});});
 readURL();render();setNav(false);syncTop();
 </script>
</body>
